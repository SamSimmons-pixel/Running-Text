services:
  app:
    build: .
    container_name: laravel_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - vendor_data:/var/www/vendor        # preserves vendor/ from image build
      - build_data:/var/www/public/build   # preserves public/build/ from npm run build
    depends_on:
      db:
        condition: service_healthy         # wait until MySQL is actually ready
    networks:
      - app_net

  db:
    image: mysql:9.7
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: running-text-db
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "laravel", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  reverb:
    build: .
    container_name: laravel_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./:/var/www
      - vendor_data:/var/www/vendor        # same vendor volume
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy         # wait until MySQL is actually ready
    networks:
      - app_net

  queue:
    build: .
    container_name: laravel_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3
    environment:
      REVERB_HOST: "reverb"
    volumes:
      - ./:/var/www
      - vendor_data:/var/www/vendor        # same vendor volume
    depends_on:
      db:
        condition: service_healthy         # wait until MySQL is actually ready
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  db_data:
  vendor_data:   # ← populated from image on first run
  build_data:    # ← populated from image on first run

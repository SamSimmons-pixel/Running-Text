name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          APP_NAME=Laravel
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}
          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=en_US
          APP_MAINTENANCE_DRIVER=file
          BCRYPT_ROUNDS=12
          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=error
          DB_CONNECTION=mysql
          DB_HOST=db
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null
          BROADCAST_CONNECTION=reverb
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=database
          CACHE_STORE=database
          REVERB_APP_ID=${{ secrets.REVERB_APP_ID }}
          REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}
          REVERB_APP_SECRET=${{ secrets.REVERB_APP_SECRET }}
          REVERB_HOST=${{ secrets.REVERB_HOST }}
          REVERB_PORT=8080
          REVERB_SCHEME=http
          VITE_APP_NAME=Laravel
          VITE_REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}
          VITE_REVERB_HOST=${{ secrets.REVERB_HOST }}
          VITE_REVERB_PORT=8080
          VITE_REVERB_SCHEME=http
          EOF

      - name: Build Docker image
        run: docker build -t running-text-app .

      - name: Verify image exists
        run: docker image inspect running-text-app

